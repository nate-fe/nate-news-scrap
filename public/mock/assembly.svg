<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27466f"/>
      <stop offset="0.5" stop-color="#7d86a6"/>
      <stop offset="0.8" stop-color="#e7a874"/>
      <stop offset="1" stop-color="#f4cf9c"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e5547"/>
      <stop offset="0.45" stop-color="#86b39b"/>
      <stop offset="1" stop-color="#28493d"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e9dc"/>
      <stop offset="1" stop-color="#b9ad9b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7444"/>
      <stop offset="1" stop-color="#2c3d1f"/>
    </linearGradient>
    <linearGradient id="plaza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9bfae"/>
      <stop offset="1" stop-color="#8f8676"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="530" cy="250" r="46" fill="#fde7bd" opacity="0.75" filter="url(#soft)"/>
  <g fill="#fff" opacity="0.22" filter="url(#soft)">
    <ellipse cx="120" cy="80" rx="110" ry="18"/>
    <ellipse cx="420" cy="60" rx="140" ry="16"/>
    <ellipse cx="560" cy="130" rx="90" ry="12"/>
  </g>

  <!-- 뒤쪽 나무 -->
  <g fill="#30472c">
    <ellipse cx="70" cy="300" rx="70" ry="45"/>
    <ellipse cx="150" cy="310" rx="50" ry="32"/>
    <ellipse cx="575" cy="298" rx="75" ry="48"/>
    <ellipse cx="495" cy="312" rx="45" ry="28"/>
  </g>

  <!-- 돔 -->
  <rect x="255" y="166" width="130" height="40" fill="url(#stone)"/>
  <g fill="#d9cfbf">
    <rect x="262" y="172" width="8" height="30"/><rect x="282" y="172" width="8" height="30"/>
    <rect x="302" y="172" width="8" height="30"/><rect x="330" y="172" width="8" height="30"/>
    <rect x="350" y="172" width="8" height="30"/><rect x="370" y="172" width="8" height="30"/>
  </g>
  <path d="M244 168 Q320 64 396 168 Z" fill="url(#dome)"/>
  <path d="M244 168 L396 168" stroke="#1f3a30" stroke-width="3"/>
  <rect x="316" y="94" width="8" height="18" fill="#cfc4b2"/>

  <!-- 본관 -->
  <rect x="140" y="204" width="360" height="14" fill="#ddd3c3"/>
  <rect x="150" y="216" width="340" height="88" fill="url(#stone)"/>
  <g fill="#fbf7f0" stroke="#a89c89" stroke-width="1">
    <rect x="176" y="222" width="14" height="78"/><rect x="211" y="222" width="14" height="78"/>
    <rect x="246" y="222" width="14" height="78"/><rect x="281" y="222" width="14" height="78"/>
    <rect x="345" y="222" width="14" height="78"/><rect x="380" y="222" width="14" height="78"/>
    <rect x="415" y="222" width="14" height="78"/><rect x="450" y="222" width="14" height="78"/>
  </g>
  <rect x="306" y="240" width="28" height="64" fill="#6b5f4f"/>
  <g fill="#8d816f" opacity="0.5">
    <rect x="193" y="236" width="14" height="22"/><rect x="228" y="236" width="14" height="22"/>
    <rect x="263" y="236" width="14" height="22"/><rect x="362" y="236" width="14" height="22"/>
    <rect x="397" y="236" width="14" height="22"/><rect x="432" y="236" width="14" height="22"/>
  </g>

  <!-- 계단과 광장 -->
  <rect x="140" y="302" width="360" height="6" fill="#d8cebe"/>
  <rect x="128" y="308" width="384" height="6" fill="#cbc1b0"/>
  <rect x="116" y="314" width="408" height="6" fill="#bfb4a2"/>
  <rect y="320" width="640" height="80" fill="url(#ground)"/>
  <path d="M230 320 L410 320 L520 400 L120 400 Z" fill="url(#plaza)"/>

  <!-- 앞쪽 가로등 -->
  <g stroke="#2b2b2b" stroke-width="3">
    <line x1="110" y1="300" x2="110" y2="372"/>
    <line x1="530" y1="300" x2="530" y2="372"/>
  </g>
  <circle cx="110" cy="298" r="6" fill="#ffe7a8"/>
  <circle cx="530" cy="298" r="6" fill="#ffe7a8"/>

  <rect width="640" height="400" fill="url(#vignette)"/>
</svg>
